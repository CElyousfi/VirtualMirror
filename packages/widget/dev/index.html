<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Virtual Mirror widget harness</title>
    <style>body { font-family: system-ui, sans-serif; padding: 24px; } button { padding: 12px 20px; font-size: 16px; }</style>
  </head>
  <body>
    <h1>Widget development harness</h1>
    <p>Opens the live mirror with the generic demo frame. Uses your webcam. Add <code>?vm_debug=1</code> for stats and alignment dots.</p>
    <button id="open">Try On Live</button>
    <script type="module">
      import "/src/index.ts";
      const debug = new URLSearchParams(location.search).has("vm_debug");
      const manifest = {
        v: 1, enabled: true, updatedAt: new Date().toISOString(),
        assets: [{ variantIds: ["*"], label: "Demo", glbUrl: new URL("/demo-frame.glb", location.href).href, bridgeM: [0, 0, 0], frameWidthM: 0.138, scale: "estimated" }],
      };
      document.getElementById("open").addEventListener("click", (e) =>
        window.VirtualMirror.open({ manifest, productTitle: "Generic demo frame", variantId: null, cartAddUrl: "/cart/add.js", cartUrl: "/cart", debug, returnFocusTo: e.currentTarget }),
      );
    </script>
  </body>
</html>
